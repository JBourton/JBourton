name: Refresh contribution header

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild header graphs
        run: python scripts/build_header.py

      - name: Commit only if the graph changed
        run: |
          if [ -n "$(git status --porcelain assets/header-light.svg assets/header-dark.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/header-light.svg assets/header-dark.svg
            git commit -m "Refresh contribution header"
            git push
          fi
